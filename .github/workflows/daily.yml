name: Generate and deploy daily brief

on:
  schedule:
    - cron: "17 */2 * * *"
    - cron: "47 0 * * *"
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify collection and schedule logic
        run: node --test tests/news-core.test.mjs tests/workflow-schedule.test.mjs

      - name: Generate latest brief and archive
        continue-on-error: true
        run: node scripts/generate.mjs

      - name: Collect news and generate mobile homepage
        run: node scripts/collect-news.mjs

      - name: Verify generated pages
        run: node --test tests/live-refresh.test.mjs tests/news-output.test.mjs

      - name: Commit generated pages when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/ai.html site/latest.json site/archive
          if ! git diff --cached --quiet; then
            git commit -m "chore: update daily news"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
